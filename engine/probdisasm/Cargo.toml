[package]
name = "probdisasm"
version = "0.2.2"
authors = ["Anonymous Author(s)"]
categories = ["parsing", "command-line-utilities"]
description = "An implementation of probabilistic disassembly for ELF binaries."
keywords = ["binary", "elf", "disassembly", "static-analysis"]
edition = "2024"
include = ["src", "CHANGELOG.md", "Cargo.toml", "LICENSE", "README.md"]
license = "MIT"
repository = "https://anonymous.4open.science/r/caveat-F0B8/"
readme = "README.md"
rust-version = "1.85.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
anyhow = "1.0.102"
capstone = "0.14.0"
goblin = "0.10.5"
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"], optional = true }

[package.metadata.docs.rs]
all-features = false

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
